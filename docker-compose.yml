# Local PostgreSQL for development and integration tests (training data only).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: petcare
      POSTGRES_PASSWORD: petcare
      POSTGRES_DB: petcare
    ports:
      - '5433:5432'
    volumes:
      - petcare-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U petcare']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  petcare-db:
