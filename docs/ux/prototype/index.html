    ownerBookings: ScreenOwnerBookings,
    ownerInstay: ScreenOwnerInstay,
    ownerDailyUpdate: ScreenOwnerDailyUpdate,
    ownerCareHistory: ScreenOwnerCareHistory,
    ownerBookAgain: ScreenOwnerBookAgain,
    ownerReview: ScreenOwnerReview,
    ownerPets: ScreenOwnerPets,
    ownerMessages: ScreenOwnerMessages,
    providerDashboard: ScreenProviderDashboard,
    providerQueue: ScreenProviderQueue,
    providerBookingDetail: ScreenProviderBookingDetail,
    providerCalendar: ScreenProviderCalendar,
    providerInstay: ScreenProviderInstay,
    providerDailyUpdate: ScreenProviderDailyUpdate,
    providerTrigger: ScreenProviderTrigger,
    providerCompleted: ScreenProviderCompleted,
    providerReviews: ScreenProviderReviews,
    providerListings: ScreenProviderListings,
    adminDashboard: ScreenAdminDashboard,
    adminRunbook: ScreenAdminRunbook,
    adminBooking: ScreenAdminBooking,
    adminModeration: ScreenAdminModeration,
    adminProviders: ScreenAdminProviders,
    adminDefection: ScreenAdminDefection,
  };

  function render() {
    const r = currentRoute();
    const screenFn = screens[r.screen] || ScreenLanding;
    const html = Shell(screenFn());
    const app = document.getElementById('app');
    app.innerHTML = html;
    app.scrollTop = 0;
    window.scrollTo({top: 0, behavior: 'instant'});
  }

  // ---------------- EVENT DELEGATION ----------------
  document.addEventListener('click', (e) => {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    const action = target.getAttribute('data-action');
    if (action === 'nav') {
      const href = target.getAttribute('href') || target.getAttribute('data-href');
      if (href && href.startsWith('#')) { e.preventDefault(); go(href); }
    } else if (action.startsWith('role:')) {
      e.preventDefault();
      const role = action.split(':')[1];
      state.currentUser = role;
      go(`#/${role}`);
    }
  });

  // ---------------- KEYBOARD ----------------
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { location.hash = '#/'; }
  });

  // ---------------- INIT ----------------
  window.addEventListener('hashchange', render);
  if (!location.hash || !routes[location.hash]) location.hash = '#/';
  render();
  </script>
</body>
</html>
